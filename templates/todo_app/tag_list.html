{% extends "base.html" %}

{% block content %}
  <h1>Tags<a href="{% url 'todo_app:tag-create' %}" class="btn btn-primary" style="float: right">Add tag</a></h1>
  <br>
  <br>
  <table class="table">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td><a href="{% url 'todo_app:tag-update' pk=tag.pk %}" class="btn btn-primary">Update</a></td>
        <td><a href="{% url 'todo_app:tag-delete' pk=tag.pk %}" class="btn btn-danger">Delete</a></td>
      </tr>
    {% endfor %}
  </table>
{% endblock content %}
