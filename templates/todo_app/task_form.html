{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Task form</h1>
  <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Save" class="btn btn-success">
    <button type="button" onclick="history.back()" class="btn btn-secondary">Cancel</button>
  </form>
{% endblock content %}
